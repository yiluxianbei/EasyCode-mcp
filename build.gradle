buildscript {
    repositories {
        mavenCentral()
        maven { url 'https://plugins.gradle.org/m2/' }
        maven { url 'https://oss.sonatype.org/content/repositories/releases/' }
    }
}

//2.1 插件配置
// 这两个插件是必备
plugins {
    id 'java'
    // IntelliJ Platform Gradle Plugin 1.x：支持 2023.3+ 平台，且保留 intellij {} DSL
    id 'org.jetbrains.intellij' version '1.17.4'
}


group 'com.sjhy'
version '1.2.9-java.RELEASE'

// 编译基线 = 最低支持平台版本（2023.3 起 ActionUpdateThread.BGT 语义完整），
// 更高的 IDE 版本（含 2025.x / 2026.x）均可直接安装运行。
// 若要针对本机 IDEA 版本调试（如 2026.2），改成本机版本号即可，例如 version '2026.2'。
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

repositories {
    mavenCentral()
}

// http://www.jetbrains.org/intellij/sdk/docs/tutorials/build_system/prerequisites.html
// https://plugins.jetbrains.com/docs/intellij/gradle-guide.html  官网gradle构建教程

intellij {
//    插件名称
    pluginName = 'EasyCode'
    // 沙箱目录位置，用于保存IDEA的设置，默认在build文件下面，防止clean，放在根目录下。
    sandboxDir = "${rootProject.rootDir}/idea-sandbox"
    // 开发环境运行时使用的版本（编译基线，勿低于 2023.3）
    version = '2023.3'
    // 社区版
//    type = 'IC'
    // 企业版
    type = 'IU'
    // 各种IDEA版本去这里找
    // https://www.jetbrains.com/intellij-repository/releases
    // 依赖的插件（IU 自带，无需额外下载）
    plugins = ['com.intellij.java', 'com.intellij.database']
    // 保持 plugin.xml 中手写的 since-build（233.0），不被自动覆盖
    updateSinceUntilBuild = false
    downloadSources = false
}

dependencies {
    // jackson工具
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.9.6'
    // guava工具
//    implementation 'com.google.guava:guava:29.0-jre'
    // velocity支持
//    implementation 'org.apache.velocity:velocity:1.7'
    // groovy支持
//    implementation 'org.codehaus.groovy:groovy:3.0.2'
    // beetl支持
//    implementation 'com.ibeetl:beetl:3.3.0.RELEASE'
    // freemarker支持
//    implementation 'org.freemarker:freemarker:2.3.30'
    // lombok 支持（1.18.42 支持 JDK 21+ 编译，旧版本在 JDK 21+ 下会注解处理失败）
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'
    // 测试用例
    testImplementation 'junit:junit:4.13.2'
}

// searchable options 需要在 IDE 里运行，构建时跳过
tasks.named('buildSearchableOptions') {
    enabled = false
}